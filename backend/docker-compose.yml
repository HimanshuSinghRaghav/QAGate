services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: qa_gate
    ports: ["5433:5432"]
    volumes: ["qa_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d qa_gate"]
      interval: 3s
      retries: 20
volumes:
  qa_pgdata:
